<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>کافه نجوم</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #fff;
      color: #000;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 36px;
      color: green;
      margin-bottom: 20px;
    }
    .section {
      margin-bottom: 30px;
    }
    .item {
      display: flex;
      justify-content: space-between;
      border: 1px solid #000;
      border-radius: 8px;
      padding: 10px;
      margin: 5px 0;
    }
    button {
      background-color: green;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .cart {
      border-top: 2px solid #000;
      margin-top: 30px;
      padding-top: 20px;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      border: 1px solid #000;
      border-radius: 4px;
    }
    .social {
      text-align: center;
      margin-top: 20px;
    }
    .social a {
      margin: 0 10px;
      color: green;
      font-size: 20px;
      text-decoration: none;
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>کافه نجوم</h1>

  <div id="menu"></div>

  <div class="cart">
    <h2>سبد خرید</h2>
    <ul id="cart-list"></ul>
    <p><strong>مجموع:</strong> <span id="total">0</span> افغانی</p>

    <h3>مشخصات سفارش‌دهنده</h3>
    <input type="text" id="name" placeholder="اسم و فامیلی">
    <input type="text" id="address" placeholder="آدرس">
    <input type="text" id="phone" placeholder="شماره تماس">
    <button onclick="sendOrder()">ارسال به واتساپ</button>
  </div>

  <div class="social">
    <a href="https://t.me/Nojom_coffee" target="_blank">تلگرام</a>
    <a href="https://instagram.com/Nojom_coffee" target="_blank">اینستاگرام</a>
  </div>

  <div class="footer">
    نجوم، سفری به کهکشان طعم‌ها
  </div>

  <script>
    const products = {
      "قهوه های گرم": [
        ["اسپرسو سینگل", 50],
        ["اسپرسو دوبل", 70],
        ["کاپوچینو", 80],
        ["لاته", 80],
        ["آمریکانو", 70],
        ["ماکیاتو", 70],
        ["لانگو", 70],
        ["هسته خرما", 60],
        ["هات چاکلیت مخصوص نجوم", 80],
      ],
      "دمنوش ها": [
        ["چای مخصوص نجوم", 80],
        ["دمنوش آرام بخش", 60],
        ["دمنوش زعفران و گل محمدی", 60],
        ["دمنوش به لیمو", 60],
        ["دمنوش موهیتو", 60],
        ["دمنوش بهارنارنج", 60],
        ["دمنوش گل گاو زبان", 60],
        ["دمنوش مخصوص نجوم", 120],
        ["چای کراک", 100],
        ["چای ماسالا", 70],
      ],
      "نوشیدنی های سرد قهوه‌ای": [
        ["آفوگاتو", 100],
        ["آیس آمریکانو", 70],
        ["آیس لاته", 70],
        ["آیس کاپوچینو", 70],
        ["آیس موکا", 100],
        ["فراپه یونانی", 100],
      ],
      "آبمیوه‌های فصلی": [
        ["آب هندوانه", 40],
        ["آب طالبی", 60],
        ["آب لیمو تازه", 60],
        ["موهیتو", 60],
        ["میکس مخصوص نجوم", 80],
        ["آب سیب", 60],
        ["آب شاه توت", 60],
        ["آب پرتغال", 60],
        ["آب انبه", 60],
        ["شیرموز", 60],
      ],
      "شیک‌ها": [
        ["شیک شکلات", 100],
        ["شیک توت فرنگی", 100],
        ["شیک بلوبری", 100],
        ["شیک موز", 100],
        ["شیک زعفران", 100],
        ["شیک وانیل", 100],
        ["شیک فندوق", 100],
        ["شیک مخصوص نجوم", 120],
      ]
    };

    const cart = [];

    function addToCart(name, price) {
      cart.push({ name, price });
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById("cart-list");
      list.innerHTML = "";
      let total = 0;
      cart.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.name} - ${item.price} افغانی`;
        list.appendChild(li);
        total += item.price;
      });
      document.getElementById("total").textContent = total;
    }

    function renderMenu() {
      const menu = document.getElementById("menu");
      for (let section in products) {
        const div = document.createElement("div");
        div.className = "section";
        const h2 = document.createElement("h2");
        h2.textContent = section;
        div.appendChild(h2);
        products[section].forEach(([name, price]) => {
          const item = document.createElement("div");
          item.className = "item";
          item.innerHTML = `
            <span>${name} - ${price} افغانی</span>
            <button onclick="addToCart('${name}', ${price})">افزودن به لیست خرید</button>
          `;
          div.appendChild(item);
        });
        menu.appendChild(div);
      }
    }

    function sendOrder() {
      const name = document.getElementById("name").value.trim();
      const address = document.getElementById("address").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (!name || !address || !phone) {
        alert("لطفا مشخصاتتان را کامل درج کنید");
        return;
      }

      if (cart.length === 0) {
        alert("هیچ موردی در سبد خرید وجود ندارد");
        return;
      }

      let message = `📦 سفارش جدید از کافه نجوم\n`;
      message += `👤 نام: ${name}\n📍 آدرس: ${address}\n📞 شماره تماس: ${phone}\n\n`;
      message += `🛒 موارد سفارش:\n`;
      let total = 0;
      cart.forEach(item => {
        message += `- ${item.name}: ${item.price} افغانی\n`;
        total += item.price;
      });
      message += `\n💵 مجموع قابل پرداخت: ${total} افغانی`;

      const whatsappLink = `https://wa.me/93795223000?text=${encodeURIComponent(message)}`;
      window.open(whatsappLink, '_blank');
    }

    renderMenu();
  </script>
</body>
</html>
